[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kram"
version = "1.0.0"
description = "A lightweight, Git-inspired version control system built from scratch in Python."
authors = [
    {name = "Swastik Bose a.k.a VasuBhakt"}
]
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
kram = "main:main"

[tool.setuptools]
py-modules = ["main", "repository", "object"]
